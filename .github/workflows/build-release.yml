
name: Build and Release APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter APK
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.50.0"
          channel: stable
          cache: true

      - name: Check Flutter Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || {
            echo "ERROR: KEYSTORE_BASE64 secret belum diatur"
            exit 1
          }

          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

          test -s android/app/upload-keystore.jks || {
            echo "ERROR: File keystore kosong"
            exit 1
          }

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          test -n "$STORE_PASSWORD" || {
            echo "ERROR: STORE_PASSWORD secret belum diatur"
            exit 1
          }

          test -n "$KEY_PASSWORD" || {
            echo "ERROR: KEY_PASSWORD secret belum diatur"
            exit 1
          }

          test -n "$KEY_ALIAS" || {
            echo "ERROR: KEY_ALIAS secret belum diatur"
            exit 1
          }

          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          EOF

      - name: Decode google-services.json
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || {
            echo "ERROR: GOOGLE_SERVICES_JSON secret belum diatur"
            exit 1
          }

          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json

          test -s android/app/google-services.json || {
            echo "ERROR: google-services.json kosong"
            exit 1
          }

      - name: Build Release APK
        run: flutter build apk --release

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2 | cut -d '+' -f 1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          echo "APK berhasil dibuat!"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: modul6-${{ steps.get_version.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: modul6-${{ needs.build.outputs.version }}
          path: ./

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: app-release.apk
          body: |
            ## Modul6 v${{ needs.build.outputs.version }}

            ### Download
            Download APK below and install on your Android device.

            ### What's New
            - Automated build via GitHub Actions
            - Release signed with production keystore

            ### Security
            - Signed with release keystore
            - Firebase configured for production
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
