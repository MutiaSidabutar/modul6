
name: modul6
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.2.0
  firebase_auth: ^7.1.0
  provider: ^6.1.5+1
  cloud_firestore: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "lib/assets/images/app_icon_blue.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "lib/assets/images/app_icon_blue.png"

flutter_native_splash:
  android: true
  ios: false
  web: false
  color: "#FFFFFF"
  image: lib/assets/images/splash_screen_icon_blue.png
  android_12:
    color: "#FFFFFF"
    image: lib/assets/images/splash_screen_icon_blue.png